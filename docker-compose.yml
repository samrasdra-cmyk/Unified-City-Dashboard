services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: city-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks: [city-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: city-kafka
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    networks: [city-net]
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: city-kafdrop
    depends_on: [kafka]
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms32M -Xmx64M"
    ports:
      - "9000:9000"
    networks: [city-net]

  postgis:
    image: timescale/timescaledb-ha:pg16-all
    container_name: city-postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citydashboard}
      POSTGRES_USER: ${POSTGRES_USER:-citydashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citydashboard_pw}
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/home/postgres/pgdata/data
    networks: [city-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citydashboard}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: city-redis
    ports:
      - "6379:6379"
    networks: [city-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: city-backend
    depends_on:
      kafka:
        condition: service_healthy
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgis
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-citydashboard}:${POSTGRES_PASSWORD:-citydashboard_pw}@postgis:5432/${POSTGRES_DB:-citydashboard}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: ["/app/entrypoint.sh"]
    networks: [city-net]

  frontend:
    build:
      context: ./frontend
    container_name: city-frontend
    depends_on: [backend]
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks: [city-net]

networks:
  city-net:
    driver: bridge

volumes:
  postgis-data:
